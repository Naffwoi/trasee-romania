name: iOS IPA Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios_ipa.yaml'
  workflow_dispatch:

concurrency:
  group: ios-ipa-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA (AltStore / SideStore / Sideloadly)
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release Runner.app (no codesign)
        run: |
          PUBSPEC_VERSION=$(sed -nE 's/^version: *([^ ]+).*/\1/p' pubspec.yaml)
          VERSION=${PUBSPEC_VERSION%%+*}
          BASE_BUILD=${PUBSPEC_VERSION#*+}
          BUILD=$((BASE_BUILD + GITHUB_RUN_NUMBER))
          {
            echo "APP_VERSION=$VERSION"
            echo "APP_BUILD=$BUILD"
          } >> "$GITHUB_ENV"
          flutter build ios --release --no-codesign --build-number="$BUILD"

      - name: Package Runner.app into Sideloadable IPA & SideStore Feed
        run: |
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/TraseeRomania-iOS-unsigned.ipa Payload
          python3 - <<'PY'
          import datetime
          import json
          import os
          from pathlib import Path

          repo = os.environ["GITHUB_REPOSITORY"]
          version = os.environ["APP_VERSION"]
          build = str(os.environ["APP_BUILD"])
          size = Path("dist/TraseeRomania-iOS-unsigned.ipa").stat().st_size
          now = datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ")
          download_url = f"https://github.com/{repo}/releases/download/ios-latest/TraseeRomania-iOS-unsigned.ipa"
          desc = f"v{version}: Grup Live 1-tap + Planificare tură & cod QR, poze reale din Carpați, card Salvamont compact, UI fără suprapuneri și fără date 1 ian. 1."

          feed = json.loads(Path("../altstore.json").read_text(encoding="utf-8"))
          app = feed["apps"][0]
          app["version"] = version
          app["versionDate"] = now
          app["versionDescription"] = desc
          app["downloadURL"] = download_url
          app["size"] = size
          app["versions"] = [
              {
                  "version": version,
                  "buildVersion": build,
                  "date": now,
                  "localizedDescription": desc,
                  "downloadURL": download_url,
                  "size": size,
                  "minOSVersion": app.get("versions", [{}])[0].get("minOSVersion", "14.0"),
              }
          ]
          Path("dist/altstore.json").write_text(
              json.dumps(feed, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - uses: actions/upload-artifact@v7
        with:
          name: TraseeRomania-iOS-unsigned-ipa
          path: |
            app/dist/TraseeRomania-iOS-unsigned.ipa
            app/dist/altstore.json
          retention-days: 30

      - name: Publish rolling ios-latest release with IPA & SideStore feed
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-latest"
          SOURCE_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/altstore.json"
          NOTES="Build automat iOS (unsigned .ipa) preconfigurat cu **https://trasee.skillfy.ro**.\n\n### Instalare & Update Remote pe iPhone:\n- **SideStore / AltStore Source URL (auto-update în telefon):** \`${SOURCE_URL}\`\n- **Nativ (.ipa manual):** Instalează \`TraseeRomania-iOS-unsigned.ipa\` cu **SideStore**, **AltStore** sau **Sideloadly**.\n- **Instant Safari (PWA, 0 configurări):** Deschide \`https://trasee.skillfy.ro\` în **Safari** → **Share** → **Adaugă la ecranul principal**."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/TraseeRomania-iOS-unsigned.ipa dist/altstore.json --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes "$NOTES" -R "$GITHUB_REPOSITORY"
          else
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "$TAG"
            gh release create "$TAG" dist/TraseeRomania-iOS-unsigned.ipa dist/altstore.json \
              --title "Trasee România — Mobile Apps (iOS .ipa & Android .apk)" \
              --notes "$NOTES" \
              --prerelease \
              -R "$GITHUB_REPOSITORY"
          fi
