name: iOS IPA Build

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - '.github/workflows/ios_ipa.yaml'
  workflow_dispatch:

concurrency:
  group: ios-ipa-build
  cancel-in-progress: true

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.47.8'

jobs:
  build-ipa:
    name: Build Unsigned iOS IPA (AltStore / SideStore / Sideloadly)
    runs-on: macos-26
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build iOS release Runner.app (no codesign)
        run: |
          PUBSPEC_VERSION=$(sed -nE 's/^version: *([^ ]+).*/\1/p' pubspec.yaml)
          BASE_BUILD=${PUBSPEC_VERSION#*+}
          BUILD=$((BASE_BUILD + GITHUB_RUN_NUMBER))
          flutter build ios --release --no-codesign --build-number="$BUILD"

      - name: Package Runner.app into Sideloadable IPA
        run: |
          rm -rf Payload dist
          mkdir -p Payload dist
          cp -R build/ios/iphoneos/Runner.app Payload/
          zip -qry dist/TraseeRomania-iOS-unsigned.ipa Payload

      - uses: actions/upload-artifact@v7
        with:
          name: TraseeRomania-iOS-unsigned-ipa
          path: app/dist/TraseeRomania-iOS-unsigned.ipa
          retention-days: 30

      - name: Publish rolling ios-latest release with IPA
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="ios-latest"
          NOTES="Build automat iOS (unsigned .ipa) preconfigurat cu **https://trasee.skillfy.ro**.\n\n### Instalare pe iPhone:\n- **Instant (Recomandat, 0 configurări):** Deschide \`https://trasee.skillfy.ro\` în **Safari** pe iPhone → **Share** → **Adaugă la ecranul principal (Add to Home Screen)**.\n- **Nativ (.ipa sideload):** Instalează \`TraseeRomania-iOS-unsigned.ipa\` cu **SideStore**, **AltStore** sau **Sideloadly** (folosind Apple ID-ul personal gratuit)."
          if gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/TraseeRomania-iOS-unsigned.ipa --clobber -R "$GITHUB_REPOSITORY"
            gh release edit "$TAG" --notes "$NOTES" -R "$GITHUB_REPOSITORY"
          else
            git tag -f "$TAG" "$GITHUB_SHA"
            git push -f origin "$TAG"
            gh release create "$TAG" dist/TraseeRomania-iOS-unsigned.ipa \
              --title "Trasee România — iOS App (.ipa)" \
              --notes "$NOTES" \
              --prerelease \
              -R "$GITHUB_REPOSITORY"
          fi
