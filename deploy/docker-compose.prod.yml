x-env: &env
  MEILI_URL: http://search:7700
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
  ORIGIN: ${ORIGIN:?set ORIGIN in .env}
  POCKETBASE_ENCRYPTION_KEY: ${POCKETBASE_ENCRYPTION_KEY:?set POCKETBASE_ENCRYPTION_KEY in .env}
  POCKETBASE_PROXY_SECRET: ${POCKETBASE_PROXY_SECRET:?set POCKETBASE_PROXY_SECRET in .env}

services:
  search:
    container_name: wanderer-search
    image: getmeili/meilisearch:v1.36.0
    environment:
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?set MEILI_MASTER_KEY in .env}
      MEILI_NO_ANALYTICS: "true"
      MEILI_MAX_INDEXING_MEMORY: "512Mb"
      MEILI_MAX_INDEXING_THREADS: "1"
    ports:
      - "127.0.0.1:7700:7700"
    networks:
      - wanderer
    volumes:
      - ../data/data.ms:/meili_data/data.ms
    mem_limit: 768m
    restart: unless-stopped
    healthcheck:
      test: curl --fail http://localhost:7700/health || exit 1
      interval: 15s
      retries: 10
      start_period: 20s
      timeout: 10s

  db:
    container_name: wanderer-db
    build:
      context: ../db
      dockerfile: ../deploy/Dockerfile.db
    depends_on:
      search:
        condition: service_healthy
    env_file: ../.env
    environment:
      <<: *env
    ports:
      - "127.0.0.1:8090:8090"
    networks:
      - wanderer
    volumes:
      - ../data/pb_data:/pb_data
      - ../data/plugins:/data/plugins
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/curl", "--fail", "http://localhost:8090/health"]
      interval: 15s
      retries: 10
      start_period: 25s
      timeout: 10s

  web:
    container_name: wanderer-web
    build:
      context: ../web
      dockerfile: ../deploy/Dockerfile.web
    depends_on:
      search:
        condition: service_healthy
      db:
        condition: service_healthy
    env_file: ../.env
    environment:
      <<: *env
      PUBLIC_POCKETBASE_URL: http://db:8090
      UPLOAD_FOLDER: /app/uploads
      BODY_SIZE_LIMIT: ${BODY_SIZE_LIMIT:-512M}
    volumes:
      - ../data/uploads:/app/uploads
    ports:
      - "127.0.0.1:3090:3000"
    networks:
      - wanderer
    mem_limit: 512m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:3000/api/v1/health"]
      interval: 15s
      retries: 10
      start_period: 25s
      timeout: 10s

networks:
  wanderer:
    driver: bridge
